# Production-oriented stack (WhatsApp bridge usually runs on the host for Chrome / QR).
# Usage from repo root:
#   set POSTGRES_PASSWORD, DATABASE_URL, JWT_SECRET in a .env file
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
# TLS: terminate at a host nginx — see deploy/nginx/clinic.conf.example و deploy/nginx/tenegta.tech.conf.example
# الواجهة العامة (apps/web): خدمة clinic-web على 127.0.0.1:3000

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PUBLISH_PORT:-6379}:6379"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-clinicsaas}
    ports:
      - "127.0.0.1:${POSTGRES_PUBLISH_PORT:-5432}:5432"
    volumes:
      - clinic_pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-clinicsaas}"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${N8N_PUBLISH_PORT:-5678}:5678"
    environment:
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - NODE_FUNCTION_ALLOW_BUILTIN=crypto
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:?set N8N_BASIC_AUTH_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD:?set N8N_BASIC_AUTH_PASSWORD}
      - WEBHOOK_URL=${N8N_PUBLIC_WEBHOOK_URL:-http://localhost:5678/}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-Asia/Amman}
      - OPS_DASHBOARD_URL=${OPS_DASHBOARD_URL:-http://host.docker.internal:3001}
      - SCHEDULING_SERVICE_TOKEN=${SCHEDULING_SERVICE_TOKEN:-}
      - N8N_WEBHOOK_HMAC_SECRET=${N8N_WEBHOOK_HMAC_SECRET:-}
      - BRIDGE_SEND_URL=${BRIDGE_SEND_URL:-http://host.docker.internal:3100}
      - BRIDGE_SEND_API_TOKEN=${BRIDGE_SEND_API_TOKEN:-}
      - WA_ALERT_URGENT_TO=${WA_ALERT_URGENT_TO:-}
    volumes:
      - clinic_n8n_data_prod:/home/node/.n8n
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ops-dashboard:
    build:
      context: ./ops-dashboard
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${OPS_PUBLISH_PORT:-3001}:3001"
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL for ops-dashboard}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      BRIDGE_INTERNAL_URL: ${BRIDGE_INTERNAL_URL:-http://host.docker.internal:3100}
      BRIDGE_SEND_TOKEN: ${BRIDGE_SEND_TOKEN:-}
      SCHEDULING_SERVICE_TOKEN: ${SCHEDULING_SERVICE_TOKEN:-}
      OLLAMA_URL: ${OLLAMA_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      NODE_ENV: production
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      HEALTH_DEEP_TOKEN: ${HEALTH_DEEP_TOKEN:-}
      SYSTEM_MODE: ${SYSTEM_MODE:-production}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      DEAD_LETTER_ALERT_THRESHOLD: ${DEAD_LETTER_ALERT_THRESHOLD:-5}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-ops-dashboard}
      OTEL_DEPLOYMENT_ENV: ${OTEL_DEPLOYMENT_ENV:-production}
      SENTRY_DSN: ${SENTRY_DSN:-}

  clinic-web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      ops-dashboard:
        condition: service_started
    ports:
      - "127.0.0.1:${WEB_PUBLISH_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      # داخل الشبكة Docker — يجب أن يطابق اسم خدمة ops-dashboard
      OPS_DASHBOARD_URL: ${WEB_TO_OPS_URL:-http://ops-dashboard:3001}
      SCHEDULING_SERVICE_TOKEN: ${SCHEDULING_SERVICE_TOKEN:-}

  event-consumer:
    build:
      context: ./services/event-consumer
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL for event-consumer}
      REDIS_EVENTS_STREAM: ${REDIS_EVENTS_STREAM:-ops:events:inbound}
      REDIS_CONSUMER_GROUP: ${REDIS_CONSUMER_GROUP:-ops-core}
      EVENT_DLQ_AFTER_ATTEMPTS: ${EVENT_DLQ_AFTER_ATTEMPTS:-3}

  billing-reminders-job:
    image: curlimages/curl:8.10.1
    restart: unless-stopped
    depends_on:
      ops-dashboard:
        condition: service_started
    environment:
      OPS_DASHBOARD_URL: ${OPS_INTERNAL_URL:-http://ops-dashboard:3001}
      SCHEDULING_SERVICE_TOKEN: ${SCHEDULING_SERVICE_TOKEN:-}
      BILLING_REMINDER_INTERVAL_SECONDS: ${BILLING_REMINDER_INTERVAL_SECONDS:-900}
    command:
      - /bin/sh
      - -lc
      - |
        while true; do
          if [ -n "$$SCHEDULING_SERVICE_TOKEN" ]; then
            curl -fsS -X POST \
              -H "Authorization: Bearer $$SCHEDULING_SERVICE_TOKEN" \
              "$$OPS_DASHBOARD_URL/api/internal/billing/reminders/run" \
              || echo "billing-reminders-job: tick failed"
          else
            echo "billing-reminders-job: SCHEDULING_SERVICE_TOKEN is empty; skipping tick"
          fi
          sleep "$$BILLING_REMINDER_INTERVAL_SECONDS"
        done

volumes:
  clinic_pgdata_prod:
  clinic_n8n_data_prod:
