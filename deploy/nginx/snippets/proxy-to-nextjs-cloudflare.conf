# تضمين داخل كتلة location التي تُوجّه إلى clinic-web أو ops-dashboard.
# خلف Cloudflare (برتقالي): لا تستخدم proxy_add_x_forwarded_for فقط — قد يبقي عنوانًا
# مزيّفًا أو خاطئًا في أقصى اليسار بينما CF-Connecting-IP يحمل عنوانك الحقيقي.
#
# انسخ إلى السيرفر:
#   sudo mkdir -p /etc/nginx/snippets
#   sudo cp deploy/nginx/snippets/proxy-to-nextjs-cloudflare.conf /etc/nginx/snippets/
# داخل location / قبل proxy_pass:
#   include /etc/nginx/snippets/proxy-to-nextjs-cloudflare.conf;
#   proxy_pass http://...;

# عنوان زائر واحد موثوق: ترويسة Cloudflare إن وُجدت، وإلا اتصال مباشر بـ nginx ($remote_addr).
set $clinic_visitor $http_cf_connecting_ip;
if ($clinic_visitor = "") {
  set $clinic_visitor $remote_addr;
}

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $clinic_visitor;
proxy_set_header X-Forwarded-For $clinic_visitor;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header CF-Connecting-IP $clinic_visitor;
