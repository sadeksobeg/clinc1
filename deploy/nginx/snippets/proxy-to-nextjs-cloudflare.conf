# تضمين داخل كتلة location / التي تُوجّه إلى clinic-web أو ops-dashboard
# عند استخدام Cloudflare (بروكسي برتقالي). انسخ إلى السيرفر مثلاً:
#   sudo mkdir -p /etc/nginx/snippets
#   sudo cp deploy/nginx/snippets/proxy-to-nextjs-cloudflare.conf /etc/nginx/snippets/
# ثم داخل location /:
#   include /etc/nginx/snippets/proxy-to-nextjs-cloudflare.conf;

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
