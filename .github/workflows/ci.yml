name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore ClinicSaaS.sln
      - name: Build
        run: dotnet build ClinicSaaS.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test ClinicSaaS.sln --configuration Release --no-build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/ClinicSaaS.Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/ClinicSaaS.Web/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint/Type/Build
        run: npm run build
